name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  alloy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache the Alloy distribution
        uses: actions/cache@v4
        with:
          path: .tools
          key: alloy-${{ hashFiles('scripts/alloy.py') }}
      - run: make verify-alloy

  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache the TLA+ tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tla-${{ hashFiles('scripts/tla.py') }}
      - run: make verify-tla

  quint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache the Quint CLI and its backends
        uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.quint
          key: quint-${{ hashFiles('scripts/quint.py') }}
      - run: make verify-quint

  cedar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the Cedar CLI and cvc5
        uses: actions/cache@v4
        with:
          path: .tools
          key: cedar-${{ runner.os }}-${{ hashFiles('scripts/cedar.py') }}
      - run: make verify-cedar

  souther:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Cache the Souther CLI
        uses: actions/cache@v4
        with:
          path: .tools
          key: souther-${{ hashFiles('scripts/souther.py') }}
      - run: make verify-souther

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan and the pinned Lean toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: lean-${{ runner.os }}-${{ hashFiles('scripts/lean.py', '**/lean-toolchain') }}
      - run: make verify-lean
