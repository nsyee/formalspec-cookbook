name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  alloy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache the Alloy distribution
        uses: actions/cache@v4
        with:
          path: .tools
          key: alloy-${{ hashFiles('scripts/alloy.py') }}
      - run: make verify
