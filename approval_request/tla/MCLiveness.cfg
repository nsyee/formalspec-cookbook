\* module: MCApproval
\* expect: ok
\* 活性: 進行仮定（FairSpec の弱公平性）の下で、承認待ちが永遠に続かないこと。
\* 活性の検査は対称性と併用できないので SYMMETRY は指定しない。

SPECIFICATION FairSpec

CONSTANTS
    User = {u1, u2}
    Department = {d1, d2}
    Request = {r1}
    Revision = {v1, v2}
    Nil = Nil

INVARIANT TypeOK

PROPERTIES
    PendingIsEventuallyDecided
    EveryRequestIsEventuallyClosed
